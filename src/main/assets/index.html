<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CheckMyKnowledge</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { margin: 0; padding: 16px; font-family: sans-serif; background: #f5f5f5; color: #222; }
  h1 { font-size: 20px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; }
  button { width: 100%; padding: 14px; margin-top: 10px; font-size: 16px; border: 0; border-radius: 10px; background: #1565c0; color: #fff; }
  button.op { background: #fff; color: #222; border: 2px solid #ccc; text-align: left; }
  button.op.sel { border-color: #1565c0; background: #e3f2fd; }
  button:disabled { opacity: .4; }
  input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #ccc; border-radius: 10px; -webkit-user-select: text; user-select: text; }
  .aviso { font-size: 14px; color: #b71c1c; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---- Conexión con Supabase ----
// La clave "anon"/"publishable" está pensada para ir en el cliente: por sí sola
// no permite hacer nada que las políticas de RLS en la base de datos no permitan
// (aquí: leer solo preguntas activas, e insertar resultados, nada más).
var SUPABASE_URL = "https://juvqvshcfsrtscvzluaa.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp1dnF2c2hjZnNydHNjdnpsdWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMDY4NjQsImV4cCI6MjEwNTg4Mjg2NH0.aL2bzJbTJ6DfzUlh8UaSBZ5Fah3Bae1tNBDi7R6BD68";

function cargarPreguntas() {
  var url = SUPABASE_URL + "/rest/v1/preguntas?select=texto,opciones,correcta&activa=eq.true&order=orden.asc";
  return fetch(url, {
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: "Bearer " + SUPABASE_ANON_KEY
    }
  }).then(function (resp) {
    if (!resp.ok) throw new Error("No se pudieron cargar las preguntas");
    return resp.json();
  }).then(function (filas) {
    return filas.map(function (f) { return { t: f.texto, o: f.opciones, c: f.correcta }; });
  });
}

function guardarResultado(nombreAlumno, correctas, total, respuestas) {
  var url = SUPABASE_URL + "/rest/v1/resultados";
  return fetch(url, {
    method: "POST",
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json",
      Prefer: "return=minimal"
    },
    body: JSON.stringify({ nombre: nombreAlumno, correctas: correctas, total: total, respuestas: respuestas })
  }).catch(function (e) {
    // Si falla el guardado (sin conexión, etc.) no debe impedir que el alumno vea su resultado.
    console.log("No se pudo guardar el resultado", e);
  });
}

// ---- Estado y pantallas ----
var PREGUNTAS = [];
var app = document.getElementById("app");
var nombre = "", idx = 0, resp = [];

document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

function el(tag, texto, clase) {
  var e = document.createElement(tag);
  if (texto) e.textContent = texto;
  if (clase) e.className = clase;
  return e;
}
function pantalla(card) { app.innerHTML = ""; app.appendChild(card); }

function inicio() {
  var c = el("div", "", "card");
  c.appendChild(el("h1", "CheckMyKnowledge"));
  c.appendChild(el("p", "Escribe tu nombre completo:"));
  var inp = el("input");
  inp.type = "text";
  inp.setAttribute("autocomplete", "off");
  inp.value = nombre;
  c.appendChild(inp);
  c.appendChild(el("p", "Al comenzar no podrás salir, minimizar, cambiar de pantalla ni tomar capturas. Si lo haces, el examen se cierra y deberás empezar de nuevo.", "aviso"));
  var msg = el("p", "", "aviso");
  c.appendChild(msg);
  var b = el("button", "Comenzar examen");
  b.onclick = function () {
    if (inp.value.trim().length < 3) { msg.textContent = "Escribe tu nombre."; return; }
    nombre = inp.value.trim();
    inp.blur();
    b.disabled = true;
    b.textContent = "Cargando preguntas...";
    msg.textContent = "";
    cargarPreguntas().then(function (preguntas) {
      if (!preguntas.length) throw new Error("No hay preguntas activas");
      PREGUNTAS = preguntas;
      setTimeout(function () {
        if (window.Android) Android.iniciarExamen();
        idx = 0; resp = [];
        pregunta();
      }, 300);
    }).catch(function () {
      msg.textContent = "No se pudieron cargar las preguntas. Revisa tu conexión e inténtalo de nuevo.";
      b.disabled = false;
      b.textContent = "Comenzar examen";
    });
  };
  c.appendChild(b);
  pantalla(c);
}

function pregunta() {
  var p = PREGUNTAS[idx];
  var c = el("div", "", "card");
  c.appendChild(el("p", "Pregunta " + (idx + 1) + " de " + PREGUNTAS.length));
  c.appendChild(el("h1", p.t));
  var sig = el("button", idx + 1 < PREGUNTAS.length ? "Siguiente" : "Terminar");
  sig.disabled = resp[idx] === undefined;
  p.o.forEach(function (txt, i) {
    var b = el("button", String.fromCharCode(65 + i) + ") " + txt, "op" + (resp[idx] === i ? " sel" : ""));
    b.onclick = function () {
      resp[idx] = i;
      var todos = c.querySelectorAll(".op");
      for (var k = 0; k < todos.length; k++) todos[k].className = "op" + (k === i ? " sel" : "");
      sig.disabled = false;
    };
    c.appendChild(b);
  });
  sig.onclick = function () {
    if (idx + 1 < PREGUNTAS.length) { idx++; pregunta(); } else { fin(); }
  };
  c.appendChild(sig);
  pantalla(c);
}

function fin() {
  if (window.Android) Android.terminarExamen();
  var bien = 0;
  PREGUNTAS.forEach(function (p, i) { if (resp[i] === p.c) bien++; });
  guardarResultado(nombre, bien, PREGUNTAS.length, resp);
  var c = el("div", "", "card");
  c.appendChild(el("h1", "Examen terminado"));
  c.appendChild(el("p", nombre + ": " + bien + " de " + PREGUNTAS.length + " correctas"));
  var b = el("button", "Salir");
  b.onclick = function () { if (window.Android) Android.salir(); else inicio(); };
  c.appendChild(b);
  pantalla(c);
}

inicio();
</script>
</body>
</html>
