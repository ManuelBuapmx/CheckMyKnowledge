<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CheckMyKnowledge</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { margin: 0; padding: 16px; font-family: sans-serif; background: #f5f5f5; color: #222; }
  h1 { font-size: 20px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; }
  button { width: 100%; padding: 14px; margin-top: 10px; font-size: 16px; border: 0; border-radius: 10px; background: #1565c0; color: #fff; }
  button.op { background: #fff; color: #222; border: 2px solid #ccc; text-align: left; }
  button.op.sel { border-color: #1565c0; background: #e3f2fd; }
  /* Botón secundario (p. ej. "Sección anterior"). */
  button.sec { background: #fff; color: #1565c0; border: 2px solid #1565c0; }
  button:disabled { opacity: .4; }
  input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #ccc; border-radius: 10px; -webkit-user-select: text; user-select: text; }
  .aviso { font-size: 14px; color: #b71c1c; }
  /* Etiqueta de sección (p. ej. "Unidad 1 - Present Simple"): agrupa/organiza
     preguntas de una misma materia. Es solo texto libre en preguntas.seccion —
     no es una tabla aparte ni afecta la calificación. Ahora la sección es la
     pantalla completa: todas sus preguntas se muestran juntas debajo de ella. */
  .seccion-label {
    font-size: 13px; font-weight: 700; color: #1565c0; text-transform: uppercase;
    letter-spacing: .3px; margin: -4px 0 8px;
  }
  /* Cada pregunta dentro de la pantalla de sección va separada por una línea. */
  .pregunta-bloque { padding: 14px 0; border-top: 1px solid #e0e0e0; }
  .pregunta-bloque:first-of-type { border-top: 0; }
  .pregunta-bloque h2 { font-size: 17px; margin: 0 0 4px; }
  /* --- Reloj del examen ---
     Barra fija arriba, FUERA de #app, para que siga visible y no se borre cuando
     se cambia de sección (pantalla() solo reemplaza el contenido de #app). */
  #reloj {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10; text-align: center;
    padding: 8px; font-size: 18px; font-weight: 700; background: #1565c0; color: #fff;
    font-variant-numeric: tabular-nums;
  }
  /* Últimos 5 minutos: se pone rojo para avisar al alumno. */
  #reloj.poco { background: #b71c1c; }
  body.con-reloj { padding-top: 56px; }
  /* --- Contexto por pregunta (video embebido o texto de apoyo/lectura) ---
     El video SIEMPRE va embebido (iframe), nunca como link externo: un link
     que abra YouTube fuera de la app cancelaría el examen (ver anularExamen()
     en MainActivity.java — onPause()/onWindowFocusChanged() cierran la app si
     pierde el foco). */
  .video-envoltorio {
    position: relative; width: 100%; padding-bottom: 56.25%; height: 0;
    margin-bottom: 12px; border-radius: 8px; overflow: hidden; background: #000;
  }
  .video-envoltorio iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  .contexto-texto {
    background: #eef4fb; border-left: 4px solid #1565c0; border-radius: 6px;
    padding: 10px 12px; margin-bottom: 12px; font-size: 14px; line-height: 1.4;
    white-space: pre-wrap; -webkit-user-select: text; user-select: text;
  }
  /* Mensaje que aparece bajo el video cuando el reproductor de YouTube falla
     (ver crearReproductor()). */
  .video-aviso { font-size: 13px; color: #b71c1c; margin: -6px 0 12px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---- Conexión con Supabase ----
// La clave "anon"/"publishable" está pensada para ir en el cliente: por sí sola
// no permite hacer nada que las políticas de RLS en la base de datos no permitan
// (aquí: leer solo preguntas activas, e insertar resultados, nada más).
var SUPABASE_URL = "https://juvqvshcfsrtscvzluaa.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp1dnF2c2hjZnNydHNjdnpsdWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMDY4NjQsImV4cCI6MjEwNTg4Mjg2NH0.aL2bzJbTJ6DfzUlh8UaSBZ5Fah3Bae1tNBDi7R6BD68";

// Duración total del examen, en minutos. Cámbiala aquí si hace falta.
var DURACION_MIN = 60;

function cargarMaterias() {
  var url = SUPABASE_URL + "/rest/v1/materias?select=id,nombre&activa=eq.true&order=orden.asc";
  return fetch(url, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY }
  }).then(function (resp) {
    if (!resp.ok) throw new Error("No se pudieron cargar las materias");
    return resp.json();
  });
}

function cargarPreguntas(materiaId) {
  // Ya NO se pide la respuesta correcta aquí — el servidor no la entrega a este
  // rol (anon). La calificación se hace del lado seguro, ver calificarExamen().
  // "seccion" es la etiqueta opcional de agrupación (ver comentario de
  // .seccion-label arriba).
  var url = SUPABASE_URL + "/rest/v1/preguntas?select=texto,opciones,contexto,seccion&activa=eq.true&materia_id=eq." + materiaId + "&order=orden.asc";
  return fetch(url, {
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: "Bearer " + SUPABASE_ANON_KEY
    }
  }).then(function (resp) {
    if (!resp.ok) throw new Error("No se pudieron cargar las preguntas");
    return resp.json();
  }).then(function (filas) {
    return filas.map(function (f) { return { t: f.texto, o: f.opciones, x: f.contexto || null, s: f.seccion || null }; });
  });
}

// La calificación se calcula en el servidor (función calificar_examen), que es
// la única que puede leer cuál era la opción correcta. El cliente nunca la ve,
// ni antes ni después: solo recibe el resultado ya calculado.
function calificarExamen(materiaId, nombreAlumno, respuestas) {
  var url = SUPABASE_URL + "/rest/v1/rpc/calificar_examen";
  return fetch(url, {
    method: "POST",
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ p_materia_id: materiaId, p_nombre: nombreAlumno, p_respuestas: respuestas })
  }).then(function (resp) {
    if (!resp.ok) return resp.text().then(function (t) { throw new Error(t || "No se pudo calificar el examen"); });
    return resp.json();
  });
}

// Busca un link de YouTube (youtube.com/watch?v=, youtu.be/, o ya en formato
// /embed/) dentro de un texto libre y regresa solo el ID del video, o null si no
// encuentra ninguno. Se usa para decidir si el "contexto" de una pregunta
// se muestra como video embebido o como bloque de texto plano.
function extraerIdYoutube(texto) {
  if (!texto) return null;
  var m = /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{6,})/.exec(texto);
  return m ? m[1] : null;
}

// ---- Reproductor de YouTube (API oficial de iframe) ----
// La página se identifica ante YouTube con su origen (parámetro "origin"), que
// es lo que el reproductor exige, y la API avisa el CÓDIGO del error (onError),
// que se muestra bajo el video para saber la causa real.
//
// La API es https://www.youtube.com/iframe_api; al cargar llama a la función global
// onYouTubeIframeAPIReady. Mientras no esté lista, las peticiones de video se
// guardan en ytCola y se ejecutan cuando llegue.
var ytListo = false;
var ytCola = [];
var ytContador = 0; // para dar un id único a cada contenedor de reproductor

window.onYouTubeIframeAPIReady = function () {
  ytListo = true;
  ytCola.forEach(function (f) { f(); });
  ytCola = [];
};

function cargarApiYoutube() {
  if (document.getElementById("yt-api")) return; // ya se pidió
  var s = document.createElement("script");
  s.id = "yt-api";
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
}

// Texto para el alumno/profesor según el código de error de YouTube.
function mensajeErrorVideo(codigo) {
  if (codigo === 101 || codigo === 150) return "El dueño del video no permite verlo dentro de otras apps (código " + codigo + "). Avisa a tu profesor.";
  if (codigo === 100) return "El video no existe o es privado (código 100). Avisa a tu profesor.";
  if (codigo === 153) return "YouTube rechazó la configuración del reproductor (código 153). Avisa a tu profesor.";
  if (codigo === 2) return "El enlace del video no es válido (código 2). Avisa a tu profesor.";
  return "No se pudo reproducir el video (código " + codigo + "). Avisa a tu profesor.";
}

// Crea el reproductor dentro de "destino" (un <div> ya presente en la pantalla).
// "aviso" es el elemento donde se escribe el mensaje si algo falla.
function crearReproductor(destino, idVideo, aviso) {
  function iniciar() {
    var vars = { playsinline: 1, rel: 0 };
    // origin = origen de esta página (https://<id de la app>, ver MainActivity.origenBase()).
    // Si el WebView reportara "null" no se manda, para no dar un origen inválido.
    if (window.location.origin && window.location.origin !== "null") vars.origin = window.location.origin;
    new YT.Player(destino, {
      videoId: idVideo, width: "100%", height: "100%", playerVars: vars,
      events: { onError: function (e) { aviso.textContent = mensajeErrorVideo(e.data); } }
    });
  }
  if (ytListo) { iniciar(); return; }
  ytCola.push(iniciar);
  cargarApiYoutube();
  // Si en 8 s la API no llegó (sin internet, bloqueada), se avisa en vez de dejar el cuadro negro.
  setTimeout(function () {
    if (!ytListo) aviso.textContent = "No se pudo cargar el reproductor de YouTube. Revisa tu conexión.";
  }, 8000);
}

// ---- Estado y pantallas ----
var MATERIAS = [];
var materiaId = null;
var PREGUNTAS = [];
var SECCIONES = [];      // grupos de preguntas consecutivas con la misma sección (ver agruparSecciones)
var secIdx = 0;          // sección que se está mostrando
var app = document.getElementById("app");
var nombre = "", resp = [];
var avisoFaltantes = false; // true tras avisar de preguntas sin responder (el 2.º toque ya termina)

// ---- Reloj ----
var relojTimer = null;   // id del setInterval, o null si no corre
var relojFin = 0;        // momento (ms desde 1970) en que se acaba el tiempo
var examenTerminado = false; // evita calificar dos veces (p. ej. botón + fin del tiempo a la vez)

document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

function el(tag, texto, clase) {
  var e = document.createElement(tag);
  if (texto) e.textContent = texto;
  if (clase) e.className = clase;
  return e;
}
function pantalla(card) { app.innerHTML = ""; app.appendChild(card); window.scrollTo(0, 0); }

// Formatea milisegundos como mm:ss (o h:mm:ss si hay horas).
function formatoTiempo(ms) {
  var s = Math.max(0, Math.ceil(ms / 1000));
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), seg = s % 60;
  function dos(n) { return (n < 10 ? "0" : "") + n; }
  return (h > 0 ? h + ":" : "") + dos(m) + ":" + dos(seg);
}

// Arranca el reloj. Se usa una HORA DE FIN (Date.now() + duración) y no un
// contador que resta 1 cada segundo: así, si el WebView atrasa algún tick, el
// tiempo restante sigue siendo correcto.
function iniciarReloj() {
  var barra = document.getElementById("reloj");
  if (!barra) {
    barra = el("div");
    barra.id = "reloj";
    document.body.appendChild(barra);
  }
  document.body.classList.add("con-reloj");
  relojFin = Date.now() + DURACION_MIN * 60 * 1000;
  function tick() {
    var restante = relojFin - Date.now();
    barra.textContent = "⏱ " + formatoTiempo(restante);
    barra.className = restante <= 5 * 60 * 1000 ? "poco" : "";
    if (restante <= 0) fin(true); // se acabó el tiempo: se entrega lo que haya
  }
  tick();
  relojTimer = setInterval(tick, 1000);
}

// Detiene y quita el reloj de la pantalla.
function detenerReloj() {
  if (relojTimer) { clearInterval(relojTimer); relojTimer = null; }
  var barra = document.getElementById("reloj");
  if (barra) barra.parentNode.removeChild(barra);
  document.body.classList.remove("con-reloj");
}

function elegirMateria() {
  var c = el("div", "", "card");
  c.appendChild(el("h1", "CheckMyKnowledge"));
  c.appendChild(el("p", "Cargando materias disponibles..."));
  pantalla(c);
  cargarMaterias().then(function (filas) {
    MATERIAS = filas;
    var c2 = el("div", "", "card");
    c2.appendChild(el("h1", "CheckMyKnowledge"));
    if (!MATERIAS.length) {
      c2.appendChild(el("p", "No hay ningún examen disponible en este momento. Pregúntale a tu profesor.", "aviso"));
      pantalla(c2);
      return;
    }
    c2.appendChild(el("p", "Elige la materia:"));
    MATERIAS.forEach(function (m) {
      var b = el("button", m.nombre);
      b.onclick = function () { materiaId = m.id; inicio(); };
      c2.appendChild(b);
    });
    pantalla(c2);
  }).catch(function () {
    var c3 = el("div", "", "card");
    c3.appendChild(el("h1", "CheckMyKnowledge"));
    c3.appendChild(el("p", "No se pudo conectar. Revisa tu conexión e inténtalo de nuevo.", "aviso"));
    var b = el("button", "Reintentar");
    b.onclick = elegirMateria;
    c3.appendChild(b);
    pantalla(c3);
  });
}

// Agrupa las preguntas (ya ordenadas) en secciones: cada vez que cambia el
// texto de "seccion" respecto a la pregunta anterior empieza un grupo nuevo.
// Las preguntas sin sección que van seguidas forman un solo grupo sin título.
// Cada grupo guarda los ÍNDICES en PREGUNTAS (así resp[] sigue siendo plano).
function agruparSecciones(preguntas) {
  var grupos = [];
  preguntas.forEach(function (p, i) {
    var ultimo = grupos[grupos.length - 1];
    if (ultimo && ultimo.nombre === p.s) ultimo.indices.push(i);
    else grupos.push({ nombre: p.s, indices: [i] });
  });
  return grupos;
}

function inicio() {
  var c = el("div", "", "card");
  c.appendChild(el("h1", "CheckMyKnowledge"));
  c.appendChild(el("p", "Escribe tu nombre completo:"));
  var inp = el("input");
  inp.type = "text";
  inp.setAttribute("autocomplete", "off");
  inp.value = nombre;
  c.appendChild(inp);
  c.appendChild(el("p", "Tendrás " + DURACION_MIN + " minutos para contestar. Al terminar el tiempo, el examen se entrega solo con lo que lleves.", "aviso"));
  c.appendChild(el("p", "Al comenzar no podrás salir, minimizar, cambiar de pantalla ni tomar capturas. Si lo haces, el examen se cierra y deberás empezar de nuevo.", "aviso"));
  var msg = el("p", "", "aviso");
  c.appendChild(msg);
  var b = el("button", "Comenzar examen");
  b.onclick = function () {
    if (inp.value.trim().length < 3) { msg.textContent = "Escribe tu nombre."; return; }
    nombre = inp.value.trim();
    inp.blur();
    b.disabled = true;
    b.textContent = "Cargando preguntas...";
    msg.textContent = "";
    cargarPreguntas(materiaId).then(function (preguntas) {
      if (!preguntas.length) throw new Error("No hay preguntas activas");
      PREGUNTAS = preguntas;
      SECCIONES = agruparSecciones(preguntas);
      setTimeout(function () {
        if (window.Android) Android.iniciarExamen();
        secIdx = 0;
        // -1 = sin responder. Se usa -1 (y no un hueco/null) para que el arreglo
        // enviado al servidor siempre lleve un número por pregunta; -1 nunca
        // coincide con una opción correcta, así que cuenta como mala.
        resp = PREGUNTAS.map(function () { return -1; });
        examenTerminado = false;
        avisoFaltantes = false;
        iniciarReloj();
        pantallaSeccion();
      }, 300);
    }).catch(function () {
      msg.textContent = "No se pudieron cargar las preguntas. Revisa tu conexión e inténtalo de nuevo.";
      b.disabled = false;
      b.textContent = "Comenzar examen";
    });
  };
  c.appendChild(b);
  pantalla(c);
}

// Arma el bloque de "contexto" que va arriba de una pregunta (si trae uno):
// video de YouTube si se detecta un link, o un bloque de texto plano si no
// (instrucciones, pasaje de lectura, etc.).
//
// Regresa { nodo, iniciar }: "nodo" es lo que se agrega a la pantalla; "iniciar"
// (solo en videos) se llama DESPUÉS de que el nodo ya está en el documento, porque
// la API de YouTube necesita encontrar el contenedor en pantalla para reemplazarlo
// por el reproductor.
function bloqueContexto(p) {
  if (!p.x) return null;
  var idVideo = extraerIdYoutube(p.x);
  if (idVideo) {
    var caja = el("div");
    var envoltorio = el("div", "", "video-envoltorio");
    var destino = el("div");
    destino.id = "yt-destino-" + (++ytContador);
    envoltorio.appendChild(destino);
    var aviso = el("p", "", "video-aviso");
    caja.appendChild(envoltorio);
    caja.appendChild(aviso);
    return { nodo: caja, iniciar: function () { crearReproductor(destino.id, idVideo, aviso); } };
  }
  return { nodo: el("div", p.x, "contexto-texto"), iniciar: null };
}

// Cuenta cuántas preguntas de TODO el examen siguen sin responder.
function contarSinResponder() {
  return resp.filter(function (r) { return r < 0; }).length;
}

// Muestra UNA sección completa: todas sus preguntas en la misma pantalla.
// CAMBIO (2/oct/2026): antes se mostraba una pregunta por pantalla.
// El contexto (video/texto) se muestra solo cuando cambia respecto a la
// pregunta anterior de la sección; si 10 preguntas comparten un mismo video o
// pasaje, aparece una vez arriba de ellas y no 10 veces.
function pantallaSeccion() {
  var g = SECCIONES[secIdx];
  var esUltima = secIdx + 1 >= SECCIONES.length;
  var c = el("div", "", "card");
  c.appendChild(el("p", "Sección " + (secIdx + 1) + " de " + SECCIONES.length + " · " + g.indices.length + " pregunta(s)"));
  if (g.nombre) c.appendChild(el("p", g.nombre, "seccion-label"));

  var iniciadores = [];   // funciones que arrancan los videos cuando la tarjeta ya está en pantalla
  var contextoPrevio = null;

  g.indices.forEach(function (qi) {
    var p = PREGUNTAS[qi];
    var bloque = el("div", "", "pregunta-bloque");
    if (p.x && p.x !== contextoPrevio) {
      var ctx = bloqueContexto(p);
      bloque.appendChild(ctx.nodo);
      if (ctx.iniciar) iniciadores.push(ctx.iniciar);
    }
    contextoPrevio = p.x || null;

    bloque.appendChild(el("h2", (qi + 1) + ". " + p.t));
    p.o.forEach(function (txt, i) {
      var b = el("button", String.fromCharCode(65 + i) + ") " + txt, "op" + (resp[qi] === i ? " sel" : ""));
      b.onclick = function () {
        resp[qi] = i;
        // Solo se repintan las opciones de ESTA pregunta (no se vuelve a dibujar
        // la pantalla, para no reiniciar los videos).
        var hermanas = bloque.querySelectorAll(".op");
        for (var k = 0; k < hermanas.length; k++) hermanas[k].className = "op" + (k === i ? " sel" : "");
      };
      bloque.appendChild(b);
    });
    c.appendChild(bloque);
  });

  var msg = el("p", avisoFaltantes && esUltima ? "Te faltan " + contarSinResponder() + " pregunta(s) sin responder. Revisa las secciones anteriores o toca de nuevo para terminar." : "", "aviso");
  c.appendChild(msg);

  if (secIdx > 0) {
    var ant = el("button", "← Sección anterior", "sec");
    ant.onclick = function () { secIdx--; pantallaSeccion(); };
    c.appendChild(ant);
  }
  var sig = el("button", esUltima ? (avisoFaltantes ? "Terminar de todos modos" : "Terminar examen") : "Siguiente sección →");
  sig.onclick = function () {
    if (!esUltima) { secIdx++; pantallaSeccion(); return; }
    // Última sección: si faltan respuestas se avisa UNA vez (sin confirm(), que
    // en el WebView no funciona y además robaría el foco y anularía el examen).
    var faltan = contarSinResponder();
    if (faltan > 0 && !avisoFaltantes) {
      avisoFaltantes = true;
      msg.textContent = "Te faltan " + faltan + " pregunta(s) sin responder. Revisa las secciones anteriores o toca de nuevo para terminar.";
      sig.textContent = "Terminar de todos modos";
      return;
    }
    fin(false);
  };
  c.appendChild(sig);
  pantalla(c);
  // Los reproductores se crean hasta que la tarjeta ya está en pantalla (ver bloqueContexto).
  iniciadores.forEach(function (f) { f(); });
}

// Termina el examen (por botón o por fin del tiempo) y manda a calificar.
// "porTiempo" solo cambia el texto que ve el alumno.
function fin(porTiempo) {
  if (examenTerminado) return; // ya se está calificando
  examenTerminado = true;
  detenerReloj();
  if (window.Android) Android.terminarExamen();
  var c = el("div", "", "card");
  c.appendChild(el("h1", "Calificando..."));
  if (porTiempo) c.appendChild(el("p", "Se acabó el tiempo. Se entregan las respuestas que llevabas.", "aviso"));
  c.appendChild(el("p", "Espera un momento."));
  pantalla(c);
  intentarCalificar();
}

function intentarCalificar() {
  calificarExamen(materiaId, nombre, resp).then(function (resultado) {
    var c = el("div", "", "card");
    c.appendChild(el("h1", "Examen terminado"));
    c.appendChild(el("p", nombre + ": " + resultado.correctas + " de " + resultado.total + " correctas"));
    var b = el("button", "Salir");
    b.onclick = function () { if (window.Android) Android.salir(); else elegirMateria(); };
    c.appendChild(b);
    pantalla(c);
  }).catch(function () {
    var c = el("div", "", "card");
    c.appendChild(el("h1", "No se pudo calificar"));
    c.appendChild(el("p", "Revisa tu conexión e inténtalo de nuevo. Tus respuestas no se han perdido.", "aviso"));
    var b = el("button", "Reintentar");
    b.onclick = intentarCalificar;
    c.appendChild(b);
    pantalla(c);
  });
}

elegirMateria();
