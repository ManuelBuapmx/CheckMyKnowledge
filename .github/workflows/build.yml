name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTA (28/sep/2026): antes de este paso había un bloque "Crear
      # archivos del proyecto (solo la primera vez)" que regeneraba
      # build.gradle.kts, settings.gradle.kts, AndroidManifest.xml,
      # MainActivity.java e index.html, y luego hacía "git commit && git push"
      # de vuelta al repo. Ese bootstrap ya cumplió su función una sola vez,
      # cuando el repo estaba vacío (ver run #1, commit "Crear proyecto
      # inicial"). El error "exit code 1" de ese run fue justo el
      # "git push rechazado": el runner comiteó sus archivos localmente pero
      # main ya había avanzado en GitHub (por el propio commit del workflow),
      # así que el push chocó con "! [rejected] main -> main (fetch first)".
      # Como los 6 archivos que generaba ese bloque ya están permanentemente
      # comiteados en main, el bloque quedó eliminado: ya no hace falta
      # regenerarlos ni volver a intentar un push en cada build, así que esa
      # condición de carrera no puede volver a pasar.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: checkmyknowledge-apk
          path: build/outputs/apk/debug/*.apk
